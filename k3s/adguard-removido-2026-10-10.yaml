# AdGuard Home — removido do k3s em 2026-10-10 (DNS de filtragem migrado para o Technitium, 10.100.10.15).
# Manifestos recuperados do banco do k3s logo após a remoção: é o que foi aplicado com `kubectl apply`
# (last-applied-configuration) de cada objeto. No Deployment, o volume `tls-cert` e a montagem em
# /opt/adguardhome/certs vieram de um `kubectl patch` posterior e foram acrescentados aqui à mão (o objeto vivo
# os tinha; se a montagem era somente leitura não deu para recuperar).
# Não inclui o segredo TLS (adguard/2dtecnologia-tls) nem os dados do volume adguard-pvc.
# Só referência: NÃO aplicar sem necessidade — o pod usava hostNetwork e ocupava as portas 53, 853, 8081 e 8082 do nó.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations: {}
  name: adguard
  namespace: adguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: adguard
  template:
    metadata:
      labels:
        app: adguard
    spec:
      containers:
      - image: adguard/adguardhome:latest
        name: adguard
        ports:
        - containerPort: 53
          protocol: UDP
        - containerPort: 53
          protocol: TCP
        - containerPort: 3000
          protocol: TCP
        - containerPort: 8081
          protocol: TCP
        volumeMounts:
        - mountPath: /opt/adguardhome/work
          name: adguard-data
          subPath: work
        - mountPath: /opt/adguardhome/conf
          name: adguard-data
          subPath: conf
        - mountPath: /opt/adguardhome/certs
          name: tls-cert
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      volumes:
      - name: adguard-data
        persistentVolumeClaim:
          claimName: adguard-pvc
      - name: tls-cert
        secret:
          secretName: 2dtecnologia-tls
---
apiVersion: v1
kind: Service
metadata:
  annotations: {}
  name: adguard
  namespace: adguard
spec:
  ports:
  - name: dns-udp
    port: 53
    protocol: UDP
    targetPort: 53
  - name: dns-tcp
    port: 53
    protocol: TCP
    targetPort: 53
  - name: web-setup
    port: 3000
    protocol: TCP
    targetPort: 3000
  - name: web
    port: 8081
    protocol: TCP
    targetPort: 8081
  selector:
    app: adguard
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations: {}
  name: cert-sync
  namespace: adguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations: {}
  name: write-tls-restart
  namespace: adguard
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - get
  - create
  - update
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations: {}
  name: cert-sync-write
  namespace: adguard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: write-tls-restart
subjects:
- kind: ServiceAccount
  name: cert-sync
  namespace: adguard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  annotations: {}
  name: cert-sync-read-tls
  namespace: 2d-sites
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-tls
subjects:
- kind: ServiceAccount
  name: cert-sync
  namespace: adguard
---
apiVersion: batch/v1
kind: CronJob
metadata:
  annotations: {}
  name: adguard-cert-sync
  namespace: adguard
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
          - args:
            - 'set -e

              kubectl -n 2d-sites get secret 2dtecnologia-tls -o go-template=''{{index .data "tls.crt"}}'' | base64 -d > /tmp/tls.crt

              kubectl -n 2d-sites get secret 2dtecnologia-tls -o go-template=''{{index .data "tls.key"}}'' | base64 -d > /tmp/tls.key

              NEW=$(sha256sum /tmp/tls.crt | cut -d'' '' -f1)

              CUR=$(kubectl -n adguard get secret 2dtecnologia-tls -o go-template=''{{index .data "tls.crt"}}'' 2>/dev/null | base64 -d | sha256sum | cut -d'' '' -f1 || true)

              if [ "$NEW" = "$CUR" ]; then echo "cert inalterado ($NEW) — nada a fazer"; exit 0; fi

              echo "cert mudou — atualizando secret e reiniciando AdGuard"

              kubectl -n adguard create secret tls 2dtecnologia-tls --cert=/tmp/tls.crt --key=/tmp/tls.key --dry-run=client -o yaml | kubectl -n adguard apply -f -

              kubectl -n adguard rollout restart deploy adguard

              '
            command:
            - /bin/sh
            - -c
            image: alpine/k8s:1.34.1
            name: sync
          restartPolicy: OnFailure
          serviceAccountName: cert-sync
  schedule: 17 4 * * 1
  successfulJobsHistoryLimit: 2
