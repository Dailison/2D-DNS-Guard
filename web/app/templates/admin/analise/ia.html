{% extends "admin/analise/_base.html" %}
{% block an %}
<style>
  .ia-top{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem;margin-bottom:1rem}
  .now{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:12px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:1rem;min-height:3rem}
  .now .spin{width:14px;height:14px;border:3px solid #93c5fd;border-top-color:var(--b);border-radius:50%;animation:sp 1s linear infinite;flex:0 0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .now.idle{background:#f8fafc;border-color:var(--bd)} .now.idle .spin{display:none}
  .now .ia-st{margin-left:auto;font-size:.82rem;font-weight:600;white-space:nowrap;padding-left:.8rem}
  .now .ia-st .sep{color:var(--mut);margin:0 .35rem;font-weight:400}
  .feed{list-style:none;margin:0;padding:0}
  .feed li{display:flex;gap:.6rem;align-items:baseline;padding:.45rem .2rem;border-bottom:1px solid var(--bd);font-size:.9rem}
  .feed li.novo{animation:fl 2s ease-out}
  @keyframes fl{from{background:#fef9c3}to{background:transparent}}
  .feed .h{color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.8rem}
  .feed .ic{width:1.2rem;text-align:center;flex:0 0 auto}
  .feed .d{color:var(--mut);font-size:.82rem}
  .feed a{font-weight:600;text-decoration:none}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem} @media (max-width:900px){.cols{grid-template-columns:1fr}}
  .cols>div{min-width:0} .colt{font-size:.95rem;margin:.2rem 0 .3rem} .colt .mut{font-size:.75rem;font-weight:400}
  .cols .feed{max-height:70vh;overflow:auto}
  .lst{display:inline-block;font-size:.72rem;font-weight:700;padding:.05rem .45rem;border-radius:6px;background:#fee2e2;color:#991b1b}
  .lst.sai{background:#dcfce7;color:#166534} .lst.dec{background:#ffedd5;color:#9a3412}
  .fase{display:inline-block;font-size:.68rem;font-weight:700;padding:.05rem .45rem;border-radius:999px;margin-right:.4rem;background:#e2e8f0;color:#334155;white-space:nowrap}
  .fase.f1,.fase.f1R{background:#dbeafe;color:#1e40af} .fase.f2{background:#ede9fe;color:#5b21b6} .fase.f3{background:#fef3c7;color:#92400e}
  .org{display:inline-block;font-size:.68rem;font-weight:600;padding:.05rem .4rem;border-radius:.6rem;margin-right:.35rem;white-space:nowrap}
  .org.local{background:#e0f2fe;color:#075985} .org.online{background:#dcfce7;color:#166534} .org.ti{background:#ede9fe;color:#5b21b6}
  .org.auto{background:#fee2e2;color:#991b1b} .org.regras,.org.catalogo{background:#f1f5f9;color:#475569}
  .fase.f4{background:#dcfce7;color:#166534} .fase.fB{background:#fee2e2;color:#991b1b}
</style>

<div class="ia-top">
  <div class="metric"><div class="n" id="st-fila">–</div><div class="l" title="classificação do site e em qual lista ele entra (IA local)">Fase 1 · IA local</div></div>
  <div class="metric"><div class="n" id="st-whois">–</div><div class="l" title="desconhecidos que terão o WHOIS (titular, CNPJ e atividade na Receita) consultado, .br primeiro">Fase 2 · WHOIS</div></div>
  <div class="metric"><div class="n" id="st-busca">–</div><div class="l" title="desconhecidos que serão pesquisados na web (depois do WHOIS)">Fase 3 · busca na web</div></div>
  <div class="metric"><div class="n" id="st-online">–</div><div class="l" title="o que a IA local não resolveu com confiança vai para a IA online (Gemini)">Fase 4 · IA online</div></div>
</div>

<div class="now idle" id="now"><div class="spin"></div><div id="now-txt" class="mut">Aguardando…</div>
  <div class="ia-st"><span title="analisados na última hora"><span id="st-hora">–</span>/h</span>
    <span class="sep">·</span><span title="tempo médio por domínio"><span id="st-media">–</span>/domínio</span>
    <span class="sep">·</span><span id="st-model" class="mut" title="IA local (Ollama)">IA</span> <span id="st-ia">…</span></div></div>

<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.4rem">
    <h2 style="margin:0">Atividade em tempo real</h2>
    <span><span class="mut" id="upd" style="font-size:.8rem"></span>
      <button class="btn mini" id="pausa" style="padding:.25rem .6rem;font-size:.8rem;margin-left:.5rem">Pausar</button></span>
  </div>
  <div class="cols">
    <div><h3 class="colt">🔬 Classificação</h3>
      <ul class="feed" id="feed"><li class="mut">Carregando…</li></ul></div>
    <div><h3 class="colt">⚖️ Decisão</h3>
      <ul class="feed" id="feedDec"><li class="mut">Carregando…</li></ul></div>
  </div>
</div>

<script>
(function(){
  var URL_EV = "{{ url_for('analise.ia_eventos') }}";
  var URL_DOM = "{{ url_for('analise.dominio', nome='__N__', t=tid) }}";
  var LBL = {TRABALHO:'Trabalho', NAO_TRABALHO:'Não trabalho', SUSPEITO:'Suspeito', MALICIOSO:'Malicioso', DESCONHECIDO:'Desconhecido'};
  var lastId = 0, paused = false, cur = null, curBase = 0, first = true;
  var feed = document.getElementById('feed'), feedDec = document.getElementById('feedDec');
  var LROT = {{ LISTAS_ROT|tojson }};
  var DEC = {lista_add: 1, lista_rem: 1, fase5: 1, decisao: 1, auto_block: 1, lista_ia: 1, lista_recusada: 1, aprovado: 1};
  // quem decidiu (coluna Decisão): fase 1-3 = IA local, 4 = IA online, pessoa (TI) = correção manual; "fase5" só no histórico
  var ORIGEM = {'f1:local': ['Fase 1 · IA local', 'local'], 'f2:local': ['Fase 2 · IA local', 'local'],
                'f3:local': ['Fase 3 · IA local', 'local'], 'local': ['IA local', 'local'], 'f4:online': ['Fase 4 · IA online', 'online'],
                'f5:ti': ['Pessoa (TI)', 'ti'], 'auto': ['Bloqueio automático', 'auto'], 'regras': ['Regras / feeds', 'regras'],
                'catalogo': ['Catálogo', 'catalogo']};
  function origemDe(ev){   // eventos antigos (sem origem gravada): deduz pelo texto
    if (ev.origem) return ev.origem;
    var d = ev.detail || '';
    if (/IA online/.test(d)) return 'f4:online';
    if (/IA local/.test(d)) return 'local';
    if (ev.kind === 'decisao' || /manual:|@/.test(d)) return 'f5:ti';
    if (/bloqueio automático/.test(d)) return 'auto';
    if (/feeds|NXDOMAIN|encolheu|whitelist:/.test(d)) return 'regras';
    return null;
  }
  function origemTag(ev){ var o = ORIGEM[origemDe(ev)]; return o ? el('span', 'org ' + o[1], o[0]) : null; }
  function rot(cats){ return (cats || '').split(',').filter(Boolean).map(function(c){ return LROT[c] || c; }).join(', ') || 'nenhuma lista'; }
  var WROT = {{ WL_ROT|tojson }};
  var TRAB = {TRABALHO: 'trabalho', NAO_TRABALHO: 'não é de trabalho', SUSPEITO: 'suspeito', MALICIOSO: 'malicioso', DESCONHECIDO: 'desconhecido'};
  function destino(cat){   // "wl:<categoria>" = whitelist; senão lista(s) de bloqueio
    if (!cat) return null;
    if (cat.indexOf('wl:') === 0) return ['✅ Whitelist · ' + (WROT[cat.slice(3)] || cat.slice(3)), 'sai'];
    return ['⛔ Blocklist · ' + rot(cat), ''];
  }
  function partes(ev){ var d = ev.detail || '', i = d.indexOf('|'); return i < 0 ? ['', d] : [d.slice(0, i), d.slice(i + 1)]; }

  function el(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function hora(iso){ var d = new Date(iso); return d.toLocaleTimeString('pt-BR', {timeZone:'America/Sao_Paulo'}); }
  function dur(s){ s = Math.max(0, Math.round(s)); var m = Math.floor(s/60); return m ? m + 'min ' + (s%60) + 's' : s + 's'; }
  function link(name){ var a = el('a', null, name); a.href = URL_DOM.replace('__N__', encodeURIComponent(name)); return a; }
  function badge(c){ return el('span', 'cls ' + (c || 'PENDENTE'), LBL[c] || c || '—'); }
  // resposta da IA que termina numa decisão (fase 4, ou IA local com confiança alta): só na coluna Decisão
  function virouDecisao(ev){
    return ev.kind === 'online_done' || (ev.kind === 'lista_local' && /confiança alta: a IA local decide/.test(ev.detail || ''));
  }

  // fase de cada evento (fluxo: 1 IA local · 2 WHOIS · 3 busca na web · 4 IA online, a última)
  var FASE = {llm_start: '1', llm_done: '1', llm_error: '1', rules_final: '1R', rules_alert: '1R',
              whois_start: '2', whois_done: '2', whois_error: '2', search_start: '3', search_done: '3', search_error: '3',
              online_done: '4', lista_ia: '1', auto_block: 'B', rules_batch: 'R'};
  var FASE_TXT = {'1': 'Fase 1 · IA local', '1R': 'Fase 1 · regras', '2': 'Fase 2 · WHOIS', '3': 'Fase 3 · busca na web', '4': 'Fase 4 · IA online',
                  'B': 'Bloqueio automático', 'R': 'Regras'};
  function faseTag(f){ return f ? el('span', 'fase f' + f, FASE_TXT[f] || f) : null; }

  function row(ev){
    var li = el('li'), ic = el('span', 'ic'), body = el('span');
    li.appendChild(el('span', 'h', hora(ev.created_at)));
    li.appendChild(ic); li.appendChild(body);
    var k = ev.kind, ft = DEC[k] ? origemTag(ev) : faseTag(k === 'lista_local' ? (ev.detail || '1').split('|')[0] : FASE[k]);
    if (ft) body.appendChild(ft);
    if (k === 'llm_start') {
      ic.textContent = '⏳'; body.appendChild(document.createTextNode('Analisando '));
      body.appendChild(link(ev.name)); if (ev.detail) body.appendChild(el('span', 'd', ' — ' + ev.detail));
    } else if (k === 'search_start') {
      ic.textContent = '🔎'; body.appendChild(document.createTextNode('Buscando na web '));
      body.appendChild(link(ev.name)); if (ev.detail) body.appendChild(el('span', 'd', ' — ' + ev.detail));
    } else if (k === 'whois_start') {
      ic.textContent = '🪪'; body.appendChild(document.createTextNode('Consultando WHOIS de '));
      body.appendChild(link(ev.name)); if (ev.detail) body.appendChild(el('span', 'd', ' — ' + ev.detail));
    } else if (k === 'whois_error') {
      ic.textContent = '⏸️'; body.appendChild(document.createTextNode('WHOIS indisponível ('));
      body.appendChild(link(ev.name)); body.appendChild(el('span', 'd', ') — ' + (ev.detail || '') + '; tenta de novo depois'));
    } else if (k === 'search_error') {
      ic.textContent = '⏸️'; body.appendChild(document.createTextNode('Busca na web indisponível ('));
      body.appendChild(link(ev.name)); body.appendChild(el('span', 'd', ') — ' + (ev.detail || '') + '; tenta de novo depois'));
    } else if (k === 'llm_done' || k === 'rules_final' || k === 'rules_alert' || k === 'search_done' || k === 'whois_done') {
      ic.textContent = k === 'rules_alert' ? '⚠️' : (k === 'search_done' ? '🔎' : (k === 'whois_done' ? '🪪' : '✅'));
      body.appendChild(link(ev.name)); body.appendChild(document.createTextNode(' → '));
      body.appendChild(badge(ev.classification));
      var nums = [];
      if (ev.risk != null) nums.push('risco ' + ev.risk);
      if (ev.work != null) nums.push('trabalho ' + ev.work);
      if (ev.seconds != null) nums.push(Math.round(ev.seconds) + 's');
      body.appendChild(el('span', 'd', ' ' + nums.join(' · ')));
      if (ev.detail) { body.appendChild(el('br')); body.appendChild(el('span', 'd', ev.detail)); }
    } else if (k === 'lista_local') {   // o que a IA local respondeu sobre a lista, em cada fase, e o próximo passo
      var tl = (ev.detail || '').split('|').slice(1).join('|');
      ic.textContent = /confiança alta/.test(tl) ? '🗂️' : '↪️';
      body.appendChild(link(ev.name)); body.appendChild(document.createTextNode(' → '));
      body.appendChild(el('span', 'd', tl));
    } else if (k === 'rules_batch') {
      ic.textContent = '⚙️'; body.appendChild(el('span', 'd', 'Fase A — ' + (ev.detail || '')));
    } else if (k === 'llm_error') {
      ic.textContent = '❌'; body.appendChild(document.createTextNode('Falha ao analisar '));
      body.appendChild(link(ev.name)); body.appendChild(el('span', 'd', ' — ' + (ev.detail || '')));
    } else if (k === 'auto_block') {
      ic.textContent = '⛔'; body.appendChild(el('span', 'd', 'Bloqueio automático — ' + (ev.detail || '')));
    } else if (k === 'online_done') {
      ic.textContent = '🌐'; body.appendChild(link(ev.name)); body.appendChild(document.createTextNode(' → '));
      body.appendChild(badge(ev.classification));
      if (ev.seconds != null) body.appendChild(el('span', 'd', ' ' + Math.round(ev.seconds) + 's'));
      if (ev.detail) { body.appendChild(el('br')); body.appendChild(el('span', 'd', ev.detail.replace(/^fase 4 · /, ''))); }
    } else if (k === 'lista_add' || k === 'lista_rem' || k === 'fase5' || k === 'decisao' || k === 'aprovado') {
      // só o que foi feito: para qual lista (bloqueio ou whitelist e a categoria) e se é de trabalho; o motivo fica no hover
      var p = partes(ev), dst = destino(p[0]);
      li.title = p[1] || '';
      if (!ev.name) { ic.textContent = '✋'; body.appendChild(el('span', 'd', p[1])); return li; }
      body.appendChild(link(ev.name));
      if (k === 'fase5') {
        ic.textContent = '🧑‍💻'; body.appendChild(document.createTextNode(' → ')); body.appendChild(el('span', 'lst dec', 'Decisão Humana'));
      } else if (k === 'decisao' && /nova análise/.test(p[1])) {
        ic.textContent = '🔁'; body.appendChild(document.createTextNode(' → nova análise (fase 1)'));
      } else if (k === 'lista_rem' || (k === 'decisao' && /manteve liberado|nenhuma lista|tirou/.test(p[1]))) {
        ic.textContent = '↩️'; body.appendChild(document.createTextNode(/deixou de valer no DNS/.test(p[1]) ? ' saiu do DNS: ' : ' saiu de '));
        body.appendChild(el('span', 'lst ' + (dst ? dst[1] : ''), dst ? dst[0] : rot(p[0])));
      } else {
        ic.textContent = dst && dst[1] === 'sai' ? '✅' : '⛔'; body.appendChild(document.createTextNode(' → '));
        body.appendChild(el('span', 'lst ' + (dst ? dst[1] : ''), dst ? dst[0] : rot(p[0])));
      }
      if (TRAB[ev.classification] && k !== 'lista_rem') { body.appendChild(document.createTextNode(' ')); body.appendChild(badge(ev.classification)); }
    } else if (k === 'lista_recusada') {
      var pr = partes(ev); ic.textContent = '🛑';
      body.appendChild(el('span', 'lst', rot(pr[0]))); body.appendChild(el('span', 'd', ' ' + pr[1]));
    } else if (k === 'lista_ia') {
      ic.textContent = '🗂️'; body.appendChild(el('span', 'd', (ev.detail || '').replace(/^listas pela IA/, 'Listas pela IA')));
    } else if (k === 'llm_extra') {
      ic.textContent = '🚀'; body.appendChild(el('span', 'd', 'Reforço da IA: ' + (ev.detail || '')));
    } else if (k === 'llm_unavailable') {
      ic.textContent = '⏸️'; body.appendChild(el('span', 'd', 'IA indisponível: ' + (ev.detail || '')));
    } else { ic.textContent = '•'; body.appendChild(el('span', 'd', k + ' ' + (ev.name || '') + ' ' + (ev.detail || ''))); }
    return li;
  }

  function status(d){
    var ia = document.getElementById('st-ia');
    ia.textContent = d.llm && d.llm.ok ? '● no ar' : '● fora'; ia.style.color = d.llm && d.llm.ok ? '#16a34a' : '#b91c1c';
    document.getElementById('st-model').textContent = 'IA (' + ((d.llm && d.llm.model) || '?') + ')';
    document.getElementById('st-fila').textContent = d.queue ? d.queue.ia + (d.queue.lista || 0) : '–';   // a lista faz parte da fase 1
    document.getElementById('st-fila').title = d.queue && d.queue.aguarda ? '+ ' + d.queue.aguarda + ' de pouco acesso aguardam recorrência (só regras até serem acessados de novo)' : '';
    document.getElementById('st-busca').textContent = d.queue && d.queue.busca != null ? d.queue.busca : '–';
    document.getElementById('st-whois').textContent = d.queue && d.queue.whois != null ? d.queue.whois : '–';
    document.getElementById('st-online').textContent = d.queue && d.queue.online != null ? (d.queue.online_on ? d.queue.online : d.queue.online + ' (sem chave)') : '–';
    document.getElementById('st-hora').textContent = d.last_hour ? d.last_hour.done : '–';
    document.getElementById('st-media').textContent = d.last_hour && d.last_hour.avg_seconds ? Math.round(d.last_hour.avg_seconds) + 's' : '–';
    cur = d.current; curBase = cur ? (cur.elapsed - (Date.now()/1000)) : 0;
    tick();
  }

  function tick(){
    var box = document.getElementById('now'), txt = document.getElementById('now-txt');
    if (cur) {
      box.className = 'now'; txt.textContent = '';
      txt.appendChild(document.createTextNode('Analisando agora: '));
      var ftc = faseTag(cur.fase); if (ftc) txt.appendChild(ftc);
      txt.appendChild(link(cur.name));
      txt.appendChild(el('span', 'd', ' · ' + dur(curBase + Date.now()/1000) + ' · ' + cur.total_queries + ' consultas'));
    } else {
      box.className = 'now idle';
      txt.textContent = document.getElementById('st-fila').textContent === '0' ? 'Nada na fila — aguardando domínios novos.' : 'Entre análises…';
    }
  }

  function poll(){
    if (paused) return;
    fetch(URL_EV + '?after=' + lastId, {credentials:'same-origin'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){
        if (d.error) throw new Error(d.error);
        if (first) { feed.innerHTML = ''; feedDec.innerHTML = ''; }
        var evs = (d.events || []).slice().reverse();   // mais antigo primeiro, p/ inserir no topo em ordem
        evs.forEach(function(ev){
          lastId = Math.max(lastId, ev.id);
          if (virouDecisao(ev)) return;   // a resposta virou decisão: aparece só na coluna Decisão
          var li = row(ev), alvo = DEC[ev.kind] ? feedDec : feed;
          if (alvo.firstChild && alvo.firstChild.classList && alvo.firstChild.classList.contains('mut')) alvo.removeChild(alvo.firstChild);
          if (!first) li.className = 'novo'; alvo.insertBefore(li, alvo.firstChild); lastId = Math.max(lastId, ev.id); });
        [feed, feedDec].forEach(function(f){
          if (first && !f.children.length) f.appendChild(el('li', 'mut', 'Sem atividade registrada ainda.'));
          while (f.children.length > 200) f.removeChild(f.lastChild); });
        first = false; status(d);
        document.getElementById('upd').textContent = 'atualizado ' + new Date().toLocaleTimeString('pt-BR');
      })
      .catch(function(e){ document.getElementById('upd').textContent = 'falha ao atualizar (' + e.message + ')'; });
  }

  document.getElementById('pausa').onclick = function(){
    paused = !paused; this.textContent = paused ? 'Continuar' : 'Pausar'; if (!paused) poll();
  };
  poll(); setInterval(poll, 3000); setInterval(tick, 1000);
})();
</script>
{% endblock %}
