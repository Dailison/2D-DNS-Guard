<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · 2D DNS Guard</title>
  {% include '_tema.html' %}
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:var(--fonte);color:var(--txt);background:var(--bg);min-height:100vh;
         display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.2rem}
    .box{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--bd);border-radius:var(--raio-xl);box-shadow:var(--sh-lg);
         padding:1.8rem 1.6rem;width:min(92vw,360px)}
    .box::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--pri),var(--pri-d))}
    .lg2d{width:150px;height:92px;margin:.2rem auto .8rem}
    h1{font-size:1.05rem;font-weight:600;margin:0 0 1rem;text-align:center;color:var(--txt)}
    label{display:block;font-size:.8rem;color:var(--txt2);margin:.7rem 0 .2rem;font-weight:600}
    input{width:100%;padding:.7rem .8rem;border:1px solid var(--bd2);border-radius:var(--raio-md);font:inherit;background:var(--card);color:var(--txt);
          transition:border-color .15s,box-shadow .15s}
    input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
    button{width:100%;margin-top:1.1rem;padding:.75rem;display:flex;align-items:center;justify-content:center;gap:.45rem;border:0;
           border-radius:var(--raio-lg);font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:var(--on-pri);transition:background .15s}
    button:hover{background:var(--pri-h)}
    .flash{background:var(--er-bg);color:var(--er-tx);padding:.6rem .8rem;border-radius:var(--raio-md);font-size:.9rem;margin-bottom:.6rem}
    .flash .bi{margin-right:.4rem}
    .sso{margin:.8rem 0 0;font-size:.85rem;text-align:center}
    a{color:var(--b)}
    footer{margin-top:1.1rem;font-size:.8rem;color:var(--mut)}
    footer a{text-decoration:none;font-weight:600}
  </style>
</head>
<body>
  <form class="box" method="post" action="{{ url_for('auth.login_post', next=request.args.get('next')) }}">
    <i class="lg2d" role="img" aria-label="2D Tecnologia"></i>
    <h1>DNS Guard</h1>
    {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash"><i class="bi bi-x-circle"></i>{{ m }}</div>{% endfor %}{% endwith %}
    <label>E-mail</label>
    <input type="email" name="email" required autofocus>
    <label>Senha</label>
    <input type="password" name="senha" required>
    <button type="submit"><i class="bi bi-box-arrow-in-right"></i>Entrar</button>
    {% if config.SSO_LOGIN_URL and request.args.get('local') %}
    <p class="sso"><a href="{{ url_for('auth.login') }}">Entrar com o login único 2D</a></p>
    {% endif %}
  </form>
  <footer><a href="https://www.2dtecnologia.com" target="_blank" rel="noopener">2D Tecnologia</a></footer>
</body>
</html>
